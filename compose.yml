# copy .env.example .env      then add your gateway key
# docker compose up --build
#
# Qdrant starts, ingest builds the index and exits, then the API starts.
# http://localhost:8000
#
#   docker compose down       stop, keep the index
#   docker compose down -v    stop, discard the index
#
# For masking:  INSTALL_MASKING=true docker compose build

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: contract-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # Distroless image - no curl - so this uses the binary itself.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: extract, chunk, index, exit. Rebuilds the collection each time
  # so the index always matches the contracts in the image.
  ingest:
    build:
      context: .
      args:
        INSTALL_MASKING: ${INSTALL_MASKING:-false}
    image: contract-rag:latest
    container_name: contract-rag-ingest
    env_file: .env
    environment:
      # .env points at localhost for host runs; here Qdrant is a service name.
      QDRANT_URL: http://qdrant:6333
      QDRANT_PATH: ""
    depends_on:
      qdrant:
        condition: service_healthy
    command: >
      sh -c "python scripts/extract.py &&
             python scripts/chunk.py &&
             python scripts/index.py"
    restart: "no"

  app:
    build:
      context: .
      args:
        INSTALL_MASKING: ${INSTALL_MASKING:-false}
    image: contract-rag:latest
    container_name: contract-rag-app
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_PATH: ""
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  qdrant_storage:
