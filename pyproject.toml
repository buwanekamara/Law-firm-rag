[project]
name = "contract-rag"
version = "0.1.0"
description = "Retrieval-augmented question answering over contract PDFs, with section-level citations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "openai>=3.3.1",
    "presidio-analyzer>=2.2.364",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "qdrant-client>=1.19.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
src = ["app", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
